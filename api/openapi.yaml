openapi: 3.1.0
info:
  title: RockServer API
  version: 0.2.0
  description: >-
    Contract for RockServer operational health checks and deterministic station search.
servers:
  - url: http://127.0.0.1:3000
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the process is running
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether the service is ready to receive traffic
      responses:
        "200":
          description: The configured catalog backend is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "503":
          description: The configured PostgreSQL catalog backend is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: not_ready
  /v1/search:
    post:
      operationId: searchStations
      summary: Find and rank internet radio stations
      description: >-
        Accepts a natural-language request and returns ranked station streams.
        A syntactically malformed JSON body produces 400. A well-formed JSON body
        that violates this operation's schema or semantic validation rules produces 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            examples:
              russian:
                summary: Russian-language discovery request
                value:
                  query: спокойный инструментальный джаз без вокала
                  locale: ru-RU
                  limit: 5
                  exclude_station_ids: [station-jazz-legacy]
              english:
                summary: English-language discovery request
                value:
                  query: upbeat classic rock for a road trip
                  locale: en-US
                  limit: 10
      responses:
        "200":
          description: Ranked stations and the normalized interpretation of the query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                russian:
                  summary: Russian request result
                  value:
                    request_id: req_01JAZRUS
                    normalized_query:
                      original: спокойный инструментальный джаз без вокала
                      locale: ru-RU
                      terms: [спокойный, инструментальный, джаз]
                      tags: [jazz, instrumental]
                      language: null
                      country_code: null
                    stations:
                      - id: station-jazz-001
                        name: Quiet Jazz Radio
                        stream_url: https://streams.example.com/quiet-jazz.mp3
                        homepage_url: https://example.com/quiet-jazz
                        tags: [jazz, instrumental, calm]
                        language: en
                        country_code: US
                        codec: MP3
                        bitrate_kbps: 192
                        score: 0.94
                        reason: Соответствует спокойному инструментальному джазу.
                        health: healthy
                english:
                  summary: English request result
                  value:
                    request_id: req_01JAZENG
                    normalized_query:
                      original: upbeat classic rock for a road trip
                      locale: en-US
                      terms: [upbeat, classic rock, road trip]
                      tags: [classic rock, rock]
                      language: en
                      country_code: null
                    stations:
                      - id: station-rock-001
                        name: Highway Rock
                        stream_url: https://streams.example.com/highway-rock.aac
                        homepage_url: null
                        tags: [rock, classic rock]
                        language: en
                        country_code: GB
                        codec: AAC
                        bitrate_kbps: 128
                        score: 0.91
                        reason: Strong match for upbeat classic rock.
                        health: healthy
        "400":
          description: The request body is missing, is not JSON, or contains malformed JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: malformed_request
                message: Request body must contain valid JSON.
                request_id: req_01JAZ400
                details:
                  body: unexpected end of input
        "422":
          description: The JSON is well formed but fails schema or semantic validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: validation_failed
                message: Request validation failed.
                request_id: req_01JAZ422
                details:
                  query: must not be empty
        "429":
          description: The caller has exceeded the request rate limit.
          headers:
            Retry-After:
              description: Seconds until another request should be attempted.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
          description: Natural-language station discovery request; whitespace-only values are invalid.
        locale:
          type: string
          default: en-US
          pattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
          description: BCP 47-style locale used to interpret the request.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: Maximum number of ranked stations to return.
        exclude_station_ids:
          type: array
          default: []
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: Stable station identifiers that must not appear in results.
    SearchResponse:
      type: object
      additionalProperties: false
      required: [request_id, normalized_query, stations]
      properties:
        request_id:
          type: string
          minLength: 1
        normalized_query:
          $ref: "#/components/schemas/NormalizedQuery"
        stations:
          type: array
          items:
            $ref: "#/components/schemas/StationResult"
    NormalizedQuery:
      type: object
      additionalProperties: false
      required: [original, locale, terms, tags, language, country_code]
      properties:
        original:
          type: string
        locale:
          type: string
        terms:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        language:
          type: [string, "null"]
          description: ISO 639 language code when inferred.
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code when inferred.
    StationResult:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - stream_url
        - homepage_url
        - tags
        - language
        - country_code
        - codec
        - bitrate_kbps
        - score
        - reason
        - health
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable RockServer station identifier.
        name:
          type: string
          minLength: 1
        stream_url:
          type: string
          format: uri
        homepage_url:
          type: [string, "null"]
          format: uri
        tags:
          type: array
          items:
            type: string
        language:
          type: [string, "null"]
          description: ISO 639 language code when known.
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        codec:
          type: [string, "null"]
        bitrate_kbps:
          type: [integer, "null"]
          minimum: 1
        score:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string
          minLength: 1
        health:
          type: string
          enum: [healthy, degraded, unknown]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
