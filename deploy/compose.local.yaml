services:
  rockserver:
    environment:
      ROCKSERVER_LOCAL_ADMIN_ORIGIN: ${ROCKSERVER_LOCAL_ADMIN_ORIGIN:-http://localhost}
      ROCKSERVER_SEMANTIC_PROVIDER: ${ROCKSERVER_SEMANTIC_PROVIDER:-deterministic-dev}
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    ports:
      - "127.0.0.1:${ROCKSERVER_LOCAL_HTTP_PORT:-80}:80"
