services:
  rockserver:
    image: ${ROCKSERVER_IMAGE:?ROCKSERVER_IMAGE must point to an approved immutable image}
    volumes:
      - /home/rockserver/logs:/var/log/rockserver

  catalog_seed:
    volumes:
      - /home/rockserver/logs:/var/log/rockserver

  caddy:
    image: ${ROCKSERVER_CADDY_IMAGE:?ROCKSERVER_CADDY_IMAGE must point to the approved immutable UI image}
    environment:
      ROCKSERVER_DOMAIN: ${ROCKSERVER_DOMAIN:?ROCKSERVER_DOMAIN must be the real owned domain}
      ROCKSERVER_TRUSTED_PROXY_TOKEN: ${ROCKSERVER_TRUSTED_PROXY_TOKEN:?ROCKSERVER_TRUSTED_PROXY_TOKEN must be injected outside Git}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production.template:/etc/caddy/Caddyfile:ro
