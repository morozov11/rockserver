name: rockserver

services:
  postgres:
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set outside the Compose file}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set outside the Compose file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be injected outside Git}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      # PostgreSQL 18+ stores data in a major-version subdirectory; mount the
      # parent so future pg_upgrade workflows keep the volume layout valid.
      - rockserver-postgres-data:/var/lib/postgresql
    networks:
      - database

  rockserver:
    image: ${ROCKSERVER_IMAGE:-rockserver:local}
    restart: unless-stopped
    environment:
      ROCKSERVER_BIND_ADDR: ${ROCKSERVER_BIND_ADDR:-0.0.0.0:3000}
      ROCKSERVER_LOG_DIR: /var/log/rockserver
      ROCKSERVER_STATION_ICON_DIR: /var/lib/rockserver/station-icons
      ROCKSERVER_LOG_RETENTION_DAYS: ${ROCKSERVER_LOG_RETENTION_DAYS:-14}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be injected outside Git}
      ROCKSERVER_API_BEARER_TOKEN: ${ROCKSERVER_API_BEARER_TOKEN:?ROCKSERVER_API_BEARER_TOKEN must be injected outside Git}
      ROCKSERVER_TRUSTED_PROXY_TOKEN: ${ROCKSERVER_TRUSTED_PROXY_TOKEN:?ROCKSERVER_TRUSTED_PROXY_TOKEN must be injected outside Git}
      RUST_LOG: ${RUST_LOG:-info}
      YANDEX_AI_API_KEY: ${YANDEX_AI_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_LLM_MODEL: ${YANDEX_LLM_MODEL:-}
      YANDEX_LLM_MODEL_VERSION: ${YANDEX_LLM_MODEL_VERSION:-}
      YANDEX_LLM_TIMEOUT_MS: ${YANDEX_LLM_TIMEOUT_MS:-}
      YANDEX_HOME_CLIENTID: ${YANDEX_HOME_CLIENTID:-}
      YANDEX_HOME_SECRET: ${YANDEX_HOME_SECRET:-}
      ROCKSERVER_FULL_CATALOG_PATH: /opt/rockserver/release/mobile-catalog/rockmobile-extended-2026.08.2-mobile.1.sqlite
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/health/live > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - edge
      - database

  catalog_seed:
    image: ${ROCKSERVER_IMAGE:-rockserver:local}
    restart: "no"
    entrypoint: ["/usr/local/bin/import_full_catalog"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be injected outside Git}
      ROCKSERVER_LOG_DIR: /var/log/rockserver
      ROCKSERVER_FULL_CATALOG_PATH: /opt/rockserver/release/mobile-catalog/rockmobile-extended-2026.08.2-mobile.1.sqlite
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

  caddy:
    image: ${ROCKSERVER_CADDY_IMAGE:-rockserver-caddy:local}
    restart: unless-stopped
    environment:
      ROCKSERVER_DOMAIN: ${ROCKSERVER_DOMAIN:-localhost}
      ROCKSERVER_TRUSTED_PROXY_TOKEN: ${ROCKSERVER_TRUSTED_PROXY_TOKEN:?ROCKSERVER_TRUSTED_PROXY_TOKEN must be injected outside Git}
    depends_on:
      rockserver:
        condition: service_healthy
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - edge

volumes:
  rockserver-postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  database:
    internal: true
