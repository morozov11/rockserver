[package]
name = "rockserver"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Keeps the heavy local model runtime explicit.  Production deployments enable
# this feature and point ORT_DYLIB_PATH at a locally installed ONNX Runtime.
onnx-local = ["dep:ndarray", "dep:ort", "dep:tokenizers"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "migrate", "macros", "uuid"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.9", features = ["tls", "transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
tokenizers = { version = "0.22", optional = true }
tracing-appender = "0.2.5"
yandex-cloud = "2025.4.14"

[dev-dependencies]
http-body-util = "0.1"
serde_yaml = "0.9"
tower = { version = "0.5", features = ["util"] }
